<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <div class="title-row">
          <h1>🔐 Be的密码管理中心</h1>
          <button id="themeToggleBtn" class="btn secondary mini theme-toggle" type="button" aria-label="切换主题" title="切换主题">&#x263D;</button>
        </div>
        <p class="subtitle">本地加密 · 手动触发填充</p>
        <div class="status-row">
          <span id="statusBadge" class="badge">检测中</span>
          <span id="bindingBadge" class="badge binding">网页主密码：未绑定</span>
        </div>
        <button id="openWebAppBtn" class="btn secondary" type="button">打开网页版密码管理器</button>
      </header>


      <section id="setupPanel" class="panel card hidden">
        <h2>首次使用</h2>
        <p>请先打开网页版密码管理器，并输入网页主密码进行初始化</p>
        <input id="setupPassword" type="password" placeholder="输入网页主密码" />
        <button id="setupBtn" class="btn primary">从当前网页初始化</button>
      </section>


      <section id="unlockPanel" class="panel card hidden">
        <h2>已锁定</h2>
        <p>输入主密码解锁</p>
        <input id="unlockPassword" type="password" placeholder="输入主密码" />
        <label class="checkbox-row">
          <input id="rememberDevice" type="checkbox" />
          <span>记住此设备 7 天</span>
        </label>
        <button id="unlockBtn" class="btn primary">解锁</button>
      </section>


      <section id="unlockedPanel" class="panel card hidden">
        <h2>已解锁</h2>
        <p id="vaultCount">当前记录数：0</p>
        <p id="newSinceImport" class="hint">自上次网页导入后新增：0 条</p>

        <div class="import-box">
          <label class="checkbox-row">
            <input id="replaceMode" type="checkbox" />
            <span>导入时覆盖扩展数据</span>
          </label>
          <button id="importBtn" class="btn secondary">从当前网页导入</button>
          <button id="syncToWebBtn" class="btn secondary">将新增和删除写回网页</button>
        </div>


        <div class="manual-box">
          <h3>手动新增密码</h3>
          <input id="addWebsite" type="text" placeholder="自动识别当前网站域名" readonly />
          <input id="addUsername" type="text" placeholder="用户名" />
          <div class="password-input">
            <input id="addPassword" type="password" placeholder="密码" />
            <button id="genPasswordBtn" class="pwd-action" type="button" aria-label="生成随机密码" title="生成随机密码">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z" />
                <path d="M18 4l.6 1.8L20.4 6.4l-1.8.6L18 8.8l-.6-1.8-1.8-.6 1.8-.6z" />
              </svg>
            </button>
            <button id="copyPasswordBtn" class="pwd-action" type="button" aria-label="复制密码" title="复制密码">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            </button>
            <button id="toggleAddPasswordBtn" class="pwd-action" type="button" aria-label="显示密码" title="显示密码">
              <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <label class="checkbox-row">
            <input id="addAutoTimestamp" type="checkbox" />
            <span>保存时在备注追加时间戳</span>
          </label>
          <input id="addNotes" type="text" placeholder="备注（可选）" />
          <button id="addBtn" class="btn primary">保存到扩展</button>
        </div>

        <div class="btn-grid">
          <button id="refreshBtn" class="btn secondary">刷新状态</button>
          <button id="lockBtn" class="btn danger">锁定</button>
        </div>
      </section>


      <p id="message" class="message"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
